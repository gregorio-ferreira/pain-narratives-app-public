repos:
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
    -   id: isort
-   repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
    -   id: flake8
        args: ['--extend-ignore=E231,E221,E202,E203']
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace
        exclude: '\.py$'
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: local
    hooks:
    -   id: gitleaks-staged
        name: Gitleaks (staged changes, redacted)
        entry: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
    -   id: publication-hygiene
        name: Reject private files and notebook outputs
        entry: python3 scripts/security/check_publication.py
        language: system
        pass_filenames: false
