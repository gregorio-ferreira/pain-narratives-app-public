name: Security and isolated tests
on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanners
        run: |
          python3 scripts/security/install_tools.py --dest "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Scan full history, publication files and dependencies
        run: bash scripts/security/scan.sh
      - name: Build the production image
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t pain-narratives:security .
      - name: Scan runtime image
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --format json --output "$RUNNER_TEMP/runtime-advisories.json" pain-narratives:security
          python3 scripts/security/check_image_report.py "$RUNNER_TEMP/runtime-advisories.json"
      - name: Verify runtime imports without network
        run: docker run --rm --network none --entrypoint python pain-narratives:security -c 'import pain_narratives.ui; import argon2'
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract pinned uv binary
        run: |
          uv_container=$(docker create ghcr.io/astral-sh/uv:0.13.3@sha256:bee0a2a458fd956c5df7b8b4c5fed2257b0af34866e3da7b51db0be3acb375d1 /uv --version)
          docker cp "$uv_container:/uv" "$RUNNER_TEMP/uv"
          docker rm "$uv_container"
      - name: Install locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/test-venv
        run: '"$RUNNER_TEMP/uv" sync --frozen --python "${{ matrix.python }}" --group dev'
      - name: Run isolated tests and lint
        run: |
          "$RUNNER_TEMP/test-venv/bin/python" -m pytest
          "$RUNNER_TEMP/test-venv/bin/python" -m flake8 src tests scripts
          "$RUNNER_TEMP/test-venv/bin/python" -m mypy --python-version "${{ matrix.python }}" src/pain_narratives
