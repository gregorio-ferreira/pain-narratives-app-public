[mypy]
python_version = 3.11
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
mypy_path = src
packages = pain_narratives
exclude = (^|/)(build|dist|\.venv|__pycache__|notebooks|scripts|docs|extra|alembic)/
explicit_package_bases = true

[mypy-sqlmodel.*]
ignore_missing_imports = true
